<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#401C0C" />
      <stop offset="100%" stop-color="#1F2318" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#401C0C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="#FFFFFF" filter="url(#shadow)" />
  <rect x="12" y="12" width="376" height="376" rx="24" fill="#FFFDF9" stroke="#E6D7BD" stroke-width="2"/>

  <!-- Corner Alignment Patterns (Top Left, Top Right, Bottom Left) -->
  <!-- Top Left Finder Pattern -->
  <rect x="44" y="44" width="84" height="84" rx="16" fill="url(#qrGrad)" />
  <rect x="56" y="56" width="60" height="60" rx="10" fill="#FFFFFF" />
  <rect x="68" y="68" width="36" height="36" rx="6" fill="#D9762E" />

  <!-- Top Right Finder Pattern -->
  <rect x="272" y="44" width="84" height="84" rx="16" fill="url(#qrGrad)" />
  <rect x="284" y="56" width="60" height="60" rx="10" fill="#FFFFFF" />
  <rect x="296" y="68" width="36" height="36" rx="6" fill="#D9762E" />

  <!-- Bottom Left Finder Pattern -->
  <rect x="44" y="272" width="84" height="84" rx="16" fill="url(#qrGrad)" />
  <rect x="56" y="284" width="60" height="60" rx="10" fill="#FFFFFF" />
  <rect x="68" y="296" width="36" height="36" rx="6" fill="#D9762E" />

  <!-- QR Grid Data Modules Simulated -->
  <g fill="url(#qrGrad)">
    <!-- Timing Patterns -->
    <rect x="144" y="80" width="12" height="12" rx="3" />
    <rect x="168" y="80" width="12" height="12" rx="3" />
    <rect x="192" y="80" width="12" height="12" rx="3" />
    <rect x="216" y="80" width="12" height="12" rx="3" />
    <rect x="240" y="80" width="12" height="12" rx="3" />

    <rect x="80" y="144" width="12" height="12" rx="3" />
    <rect x="80" y="168" width="12" height="12" rx="3" />
    <rect x="80" y="192" width="12" height="12" rx="3" />
    <rect x="80" y="216" width="12" height="12" rx="3" />
    <rect x="80" y="240" width="12" height="12" rx="3" />

    <!-- Data Blocks -->
    <rect x="144" y="44" width="24" height="12" rx="3"/>
    <rect x="180" y="44" width="12" height="24" rx="3"/>
    <rect x="204" y="56" width="24" height="12" rx="3"/>
    <rect x="240" y="44" width="12" height="12" rx="3"/>

    <rect x="44" y="144" width="24" height="12" rx="3"/>
    <rect x="44" y="180" width="12" height="24" rx="3"/>
    <rect x="56" y="216" width="12" height="12" rx="3"/>

    <rect x="144" y="108" width="12" height="24" rx="3"/>
    <rect x="168" y="120" width="24" height="12" rx="3"/>
    <rect x="204" y="108" width="12" height="12" rx="3"/>
    <rect x="228" y="120" width="24" height="24" rx="4"/>
    <rect x="272" y="144" width="24" height="12" rx="3"/>
    <rect x="312" y="144" width="12" height="24" rx="3"/>
    <rect x="336" y="156" width="20" height="12" rx="3"/>

    <rect x="144" y="156" width="36" height="12" rx="3"/>
    <rect x="192" y="144" width="12" height="36" rx="3"/>
    <rect x="272" y="168" width="12" height="24" rx="3"/>
    <rect x="296" y="180" width="24" height="12" rx="3"/>
    <rect x="336" y="180" width="20" height="24" rx="3"/>

    <!-- Middle region data -->
    <rect x="108" y="272" width="24" height="12" rx="3"/>
    <rect x="144" y="284" width="12" height="36" rx="3"/>
    <rect x="168" y="272" width="24" height="12" rx="3"/>
    <rect x="204" y="284" width="12" height="24" rx="3"/>
    <rect x="228" y="272" width="36" height="12" rx="3"/>

    <rect x="144" y="336" width="24" height="20" rx="3"/>
    <rect x="180" y="344" width="36" height="12" rx="3"/>
    <rect x="228" y="336" width="12" height="20" rx="3"/>
    <rect x="252" y="344" width="24" height="12" rx="3"/>

    <rect x="284" y="240" width="24" height="12" rx="3"/>
    <rect x="320" y="228" width="36" height="12" rx="3"/>
    <rect x="272" y="272" width="12" height="36" rx="3"/>
    <rect x="296" y="284" width="24" height="12" rx="3"/>
    <rect x="336" y="272" width="20" height="24" rx="3"/>

    <rect x="284" y="320" width="36" height="12" rx="3"/>
    <rect x="336" y="312" width="20" height="32" rx="3"/>

    <!-- Bottom Left alignment pattern -->
    <rect x="220" y="220" width="24" height="24" rx="6" fill="#D9762E" />
    <rect x="226" y="226" width="12" height="12" rx="3" fill="#FFFFFF" />
  </g>

  <!-- Center Logo Emblem -->
  <g transform="translate(160, 160)">
    <rect width="80" height="80" rx="20" fill="#FFFFFF" stroke="#D9762E" stroke-width="3" filter="url(#shadow)" />
    <!-- Sacred Om / Dhara Icon representation -->
    <circle cx="40" cy="40" r="26" fill="#401C0C" />
    <text x="40" y="47" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#D9762E" text-anchor="middle">🕉</text>
  </g>
